name: Central DevSecOps Pipeline

on:

  workflow_call:

    inputs:

      owner:
        required: true
        type: string

      repo_name:
        required: true
        type: string

      branch_name:
        required: true
        type: string

      target_url:
        required: false
        type: string

jobs:

# =========================================================
# CENTRAL SECURITY SCAN
# =========================================================

  security-scan:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

    # =====================================================
    # CHECKOUT TARGET REPOSITORY
    # =====================================================

    - name: Checkout Repository

      uses: actions/checkout@v4

      with:

        repository: ${{ inputs.owner }}/${{ inputs.repo_name }}

        ref: ${{ inputs.branch_name }}

        token: ${{ secrets.CENTRAL_GITHUB_PAT }}

    # =====================================================
    # DISPLAY INFORMATION
    # =====================================================

    - name: Print Metadata

      run: |

        echo "Owner: ${{ inputs.owner }}"
        echo "Repository: ${{ inputs.repo_name }}"
        echo "Branch: ${{ inputs.branch_name }}"

    # =====================================================
    # SECRET SCANNING — GITLEAKS
    # =====================================================

    - name: Run Gitleaks

      uses: gitleaks/gitleaks-action@v2

      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # =====================================================
    # SAST — SEMGREP
    # =====================================================

    - name: Run Semgrep

      uses: returntocorp/semgrep-action@v1

      with:

        config: auto

    # =====================================================
    # SCA — DEPENDENCY CHECK
    # =====================================================

    - name: Run OWASP Dependency Check

      uses: dependency-check/Dependency-Check_Action@main

      with:

        project: ${{ inputs.repo_name }}

        path: .

        format: HTML

    # =====================================================
    # CONTAINER + FILESYSTEM SCAN — TRIVY
    # =====================================================

    - name: Run Trivy Scan

      uses: aquasecurity/trivy-action@master

      with:

        scan-type: fs

        scan-ref: .

        format: table

        exit-code: 1

        severity: CRITICAL,HIGH

    # =====================================================
    # IaC SECURITY — CHECKOV
    # =====================================================

    - name: Run Checkov

      uses: bridgecrewio/checkov-action@master

      with:

        directory: .

        framework: all

    # =====================================================
    # DAST — OWASP ZAP
    # =====================================================

    - name: Run OWASP ZAP Baseline Scan

      if: ${{ inputs.target_url != '' }}

      uses: zaproxy/action-baseline@v0.12.0

      with:

        target: ${{ inputs.target_url }}

    # =====================================================
    # UPLOAD REPORTS
    # =====================================================

    - name: Upload Security Reports

      uses: actions/upload-artifact@v4

      with:

        name: security-reports

        path: |
          reports/
          *.html
          *.sarif
          *.json
